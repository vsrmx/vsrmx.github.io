<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance VW - Cover Archive</title>
<meta name="description" content="Every Performance VW cover, year by year.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-head">
  <h1>Performance VW - Cover Archive</h1>
  <p id="subtitle" class="subtitle">Loading…</p>
  <button id="order-toggle" class="order-toggle" type="button">Oldest first</button>
</header>

<nav class="year-nav" aria-label="Jump to year">
  <div id="year-nav" class="year-nav-track"></div>
</nav>

<main id="covers" class="covers" aria-live="polite"></main>

<div class="pvw-lb" role="dialog" aria-modal="true" aria-label="Cover viewer" hidden>
  <button class="pvw-lb-close" type="button" aria-label="Close">&times;</button>
  <button class="pvw-lb-prev" type="button" aria-label="Previous cover">&lsaquo;</button>
  <img class="pvw-lb-img" alt="">
  <button class="pvw-lb-next" type="button" aria-label="Next cover">&rsaquo;</button>
  <div class="pvw-lb-cap"></div>
</div>

<script src="app.js"></script>
</body>
</html>
